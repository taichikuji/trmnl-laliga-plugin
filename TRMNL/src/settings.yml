#
# Changes to this file will be overwritten by `trmnlp pull`.
#
---
description: Spanish football IP block status
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
polling_url: 'https://dns.google/resolve?name=blocked.dns.hayahora.futbol&type=A'
polling_headers: ''
polling_body: ''
icon: media/icon.svg
name: "¿Hay ahora fútbol?"
refresh_interval: 15
custom_fields:
- keyname: language
  field_type: select
  name: Language
  description: Choose the language for the plugin UI.
  options:
  - "Spanish"
  - "English"
  default: "Spanish"
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: >-
    Is football-related IP blocking active in Spain? ¿Hay ahora fútbol? displays a clear yes
    or no on your TRMNL, based on the public signal provided by hayahora.futbol. During
    periods of blocking, it also shows the number of IP addresses reported by that signal.
    <br/><br/> This is not a live football score, fixture calendar or proof that a match is
    currently being played. It is an indicator of internet blocking associated with Spanish
    football broadcasting. <br/><br/> The data is fetched through Google's public DNS resolver
    and refreshes every 15 minutes. <br/><br/> Choose Spanish or English for the interface. No
    login, API key or external service account is required. Created by Ivan Perez to make this
    otherwise invisible network status easy to check.
  category: "news,sports"
  learn_more_url: https://github.com/taichikuji/trmnl-laliga-plugin/tree/main/TRMNL#setup
  github_url: "https://github.com/taichikuji/trmnl-laliga-plugin"
